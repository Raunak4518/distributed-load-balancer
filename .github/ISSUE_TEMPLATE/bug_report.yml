name: Bug report
description: Something behaves differently from what the documentation or configuration says it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security vulnerabilities must not be reported here** — use [private vulnerability reporting](https://github.com/Raunak4518/distributed-load-balancer/security/advisories/new) instead (see SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands or request sequence that trigger the problem.
      placeholder: |
        1. Start lb-server with the config below
        2. curl -v http://127.0.0.1:8080/...
        3. ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: A minimal config.toml that reproduces the issue. Remove secrets, tokens and private addresses.
      render: toml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and metrics
      description: Relevant log lines (ideally at `debug` level) and any metrics from the admin `/metrics` endpoint that show the problem.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `lb-server --version`, or the commit SHA if built from source.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Release binary
        - .deb / .rpm package
        - Docker image
        - Built from source
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: e.g. Ubuntu 24.04, x86_64
    validations:
      required: true
