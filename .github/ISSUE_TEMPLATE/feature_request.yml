name: Feature request
description: Propose new behavior or an improvement to existing behavior.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the load balancer does not support today? Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include example configuration if it adds or changes settings.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including how other load balancers (nginx, HAProxy, Envoy, …) handle this.
  - type: textarea
    id: failure-modes
    attributes:
      label: Failure modes and limits
      description: What should happen under overload, misconfiguration, or a failing backend or peer? What needs to be bounded?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
