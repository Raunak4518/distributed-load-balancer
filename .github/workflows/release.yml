name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build static binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }} -p lb-server

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lb-server dist/lb-server
          tar -C dist -czf lb-server-${{ matrix.target }}.tar.gz lb-server

      - uses: actions/upload-artifact@v7
        with:
          name: lb-server-${{ matrix.target }}
          path: lb-server-${{ matrix.target }}.tar.gz

  macos:
    name: Build macOS binary (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p lb-server

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lb-server dist/lb-server
          tar -C dist -czf lb-server-${{ matrix.target }}.tar.gz lb-server

      - uses: actions/upload-artifact@v7
        with:
          name: lb-server-${{ matrix.target }}
          path: lb-server-${{ matrix.target }}.tar.gz

  packages:
    name: Build .deb / .rpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release -p lb-server

      - name: Build .deb
        run: (cd crates/lb-server && cargo deb --no-build)

      - name: Build .rpm
        run: cargo generate-rpm -p crates/lb-server

      - name: Collect packages
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/

      - uses: actions/upload-artifact@v7
        with:
          name: lb-server-packages
          path: dist/*

  docker:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish GitHub Release
    needs: [binaries, macos, packages, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*/*.tar.gz
            dist/*/*.deb
            dist/*/*.rpm
          generate_release_notes: true
