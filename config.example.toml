# ── Cluster coordination (optional) ───────────────────────────────────
# Omit this whole section to run as a single node.
# Enforces the rate limit ACROSS nodes: without it, N nodes each admit
# `rate_per_sec`, so the effective global limit is N x what you configured.
# The peer port is authenticated (HMAC-SHA256): a secret is required whenever
# [cluster] is set, so a misconfigured cluster fails to start rather than
# running open. Still bind it to a private interface.
# Prefer shared_secret_env — config files end up in version control.
# [cluster]
# node_id           = "lb-1"                 # must be unique per node
# listen            = "127.0.0.1:7946"       # peer sync port — bind privately
# peers             = ["127.0.0.1:7947"]     # the OTHER nodes
# sync_interval_ms  = 200
# window_secs       = 10
# shared_secret_env = "LB_CLUSTER_SECRET"    # names the env var holding it
#
#   # Mutual TLS on the peer channel (optional). Without this section the
#   # peer port is authenticated but NOT encrypted -- HMAC-SHA256 stops a
#   # peer from forging counts, but anyone who can observe the link still
#   # reads every node id and rate-limit count in the clear. Every node
#   # presents the same cert/key to every peer (gossip is symmetric: one
#   # node, one identity), and every node's ca_file must point at the same
#   # signing CA. Each node's certificate must carry its own gossip `listen`
#   # IP as a Subject Alternative Name -- that IP is what the connecting
#   # side verifies against, the same way a browser checks a hostname.
#   [cluster.tls]
#   cert_file            = "/etc/lb/peer-tls/lb-1.crt"
#   key_file             = "/etc/lb/peer-tls/lb-1.key"
#   ca_file              = "/etc/lb/peer-tls/ca.crt"
#   handshake_timeout_ms = 5000

# ── OpenTelemetry trace export (optional) ─────────────────────────────
# Omit this whole section to skip export entirely. Spans are still created
# either way (one per HTTP request, one per TCP session) — that cost is
# unconditional and cheap, per `tracing`'s own design; this section only
# controls whether anything reads them.
# otlp_endpoint is deliberately plain HTTP, not HTTPS: a collector living in
# the same trust domain as this process (a local agent, a sidecar) needs no
# TLS, and adding a second TLS stack just for a telemetry side channel isn't
# this project's problem to solve — front a remote collector with your own
# reverse proxy if you need one.
# [tracing]
# otlp_endpoint = "http://localhost:4318"
# service_name  = "lb-server"   # defaults to "lb-server" if omitted
# sample_ratio  = 1.0            # fraction of traces kept, 0.0 to 1.0

[server]
drain_timeout_ms = 10000

# ── HTTP (L7) listener ────────────────────────────────────────────────
[[listeners]]
name     = "web"
protocol = "http"
listen   = "0.0.0.0:8080"
forward_timeout_ms     = 5000
max_request_body_bytes = 1048576

# Edge hardening. Defaults shown; all optional.
max_connections        = 10000   # total in-flight connections for this listener
max_connections_per_ip = 100     # stops one source consuming the whole budget
header_read_timeout_ms = 5000    # slowloris: caps time to send the request head
body_read_timeout_ms   = 10000   # slow POST: a size limit alone is not a bound
write_timeout_ms        = 30000  # the write-side mirror of the two above: caps
                                  # time to *read* the response. Without this a
                                  # client that stops draining its socket holds
                                  # the connection open forever. HTTP-only — a
                                  # TCP listener gets the same protection from
                                  # idle_timeout_ms below instead.

# proxy_protocol = true
# Only turn this on when EVERY connection this listener accepts comes from
# one specific, trusted front-end (another load balancer, an ELB/NLB, a
# CDN) that always sends a PROXY protocol header (v1 or v2, auto-detected)
# first, ahead of anything else on the connection. Without it, this
# listener sees that front-end's own IP as the client -- every request
# looks like it came from the same source, which breaks per-client rate
# limiting, access logs, and tracing. A missing or malformed header is
# treated as fatal (the connection is dropped), not a fallback to the raw
# TCP peer: that's the whole trust boundary this option is enforcing.

# compression = false
# Compresses responses (gzip/brotli/deflate/zstd, negotiated against the
# client's Accept-Encoding) that aren't already encoded and pass a
# minimum-size/content-type check -- a CPU/latency trade-off, so off by
# default, same as nginx's own `gzip off`. HTTP-only.

# ── TLS termination (optional) ──────────────────────────────────────────
# Uncomment to terminate TLS on this listener. Certificates are read from
# disk and polled for changes on reload_interval_secs, so a renewed
# certificate takes effect without a restart — see the README's TLS section
# for why restart-to-renew is an outage generator on a 90-day schedule.
# [listeners.tls]
#   # Caps the handshake itself. Nothing above this line covers that window:
#   # hyper never sees a connection whose handshake hasn't finished, so
#   # header_read_timeout_ms cannot apply to it — this is a genuinely new
#   # control, not a rename of an existing one.
#   handshake_timeout_ms = 5000
#   # "1.2" or "1.3". Raise to "1.3" once every client you serve supports
#   # it — shorter handshake, no legacy cipher suites to reason about.
#   min_version = "1.2"
#   # Poll interval for cert/key changes on disk. New material is loaded and
#   # fully validated before it replaces what's currently serving; if it's
#   # broken, the old certificate keeps serving — a reload that breaks TLS
#   # is worse than a certificate that is a few hours stale.
#   reload_interval_secs = 60
#   # Adds Strict-Transport-Security: max-age=<value> to every response on
#   # this listener once set above 0. 0 = off, and that is the deliberate
#   # default. A browser that receives this header caches the policy for the
#   # full max-age with no way for the server to take it back early, so
#   # turning it on is close to irreversible — do it only once you're sure
#   # every host under this name will keep serving valid HTTPS. Off means no
#   # header is sent at all, deliberately not max-age=0 — that value is an
#   # active instruction to forget any previously cached policy, not merely
#   # the absence of one. (Rejected outright on a tcp listener, which has no
#   # response to put a header on.)
#   hsts_max_age_secs = 0
#
#     [[listeners.tls.certificates]]
#     name      = "web-primary"   # appears in metrics — operator-chosen,
#                                  # never client-controlled
#     cert_file = "/etc/lb/tls/web.crt"
#     key_file  = "/etc/lb/tls/web.key"
#     # SNI match list: exact hostnames win over a single-level wildcard
#     # (*.example.com matches a.example.com, not a.b.example.com or the
#     # bare parent). A ClientHello whose SNI matches nothing here is
#     # rejected rather than handed a default certificate — a mismatched
#     # cert fails in the browser anyway, so a silent fallback would only
#     # turn a clear failure into a confusing one.
#     hostnames = ["example.com", "*.example.com"]

# ── HTTP/2 (optional) ────────────────────────────────────────────────────
# The client-facing settings below only take effect on a listener whose
# [listeners.tls] above is set: HTTP/2 is negotiated over ALPN, ALPN only
# exists inside a TLS handshake, and this node is the edge, so a plaintext
# listener stays HTTP/1.1 regardless of what is written here. Every field
# below has a safe default, so a TLS listener with no [listeners.http2]
# section at all still serves HTTP/2, fully protected. backend_h2c is the
# one exception -- see its own comment below.
# [listeners.http2]
#   # HTTP/2 is on by default for a TLS listener. Set false to keep this
#   # listener on HTTP/1.1 only.
#   enabled = true
#   # Concurrent requests per connection. One HTTP/2 connection multiplexes
#   # many requests over a single socket, so a per-IP *connection* cap alone
#   # no longer bounds per-IP *work* the way it did under HTTP/1.1: at the
#   # defaults, max_connections_per_ip (100) times this (128) puts the
#   # per-IP concurrency ceiling at 12,800 requests, and since each in-flight
#   # request buffers its body up to max_request_body_bytes (1 MiB by
#   # default), that is a per-IP memory ceiling of roughly 12.8 GiB, not the
#   # ~100 MiB HTTP/1.1 implied. This setting does not restore that bound —
#   # the mandatory [listeners.rate_limit] does, since it runs before the
#   # body is read; with key = "source_ip" its burst setting is the real
#   # per-IP concurrency bound under HTTP/2.
#   max_concurrent_streams = 128
#   # Bounds Rapid Reset (CVE-2023-44487): a client opens streams and
#   # cancels them immediately, which evades max_concurrent_streams
#   # precisely by never being concurrent. 20 is deliberately h2's own
#   # built-in default (DEFAULT_REMOTE_RESET_STREAM_MAX) — higher is inert,
#   # since h2 enforces its own stricter bound underneath anyway, and lower
#   # starts cutting off ordinary cancellations (a browser navigating away,
#   # an abandoned image load) that have nothing to do with an attack.
#   max_pending_accept_reset_streams = 20
#   # Bounds resets we ourselves are forced to send back to a client whose
#   # frames keep failing protocol validation — the same DOS shape as
#   # above, aimed the other direction. h2's own default is 1024; 128 here
#   # is deliberately tighter.
#   max_local_error_reset_streams = 128
#   # Bounds HPACK and CONTINUATION expansion, where a handful of frames
#   # can otherwise inflate into a lot of server-side header state.
#   max_header_list_size = 16384
#   max_frame_size = 16384
#   # HTTP/2's liveness check, sent as PING frames on an established
#   # connection. There is no header_read_timeout equivalent here on
#   # purpose: an idle HTTP/2 connection is normal where an idle HTTP/1.1
#   # one is not, and PING is what tells the two apart.
#   keep_alive_interval_secs = 20
#   keep_alive_timeout_secs = 10
#   # Prior-knowledge h2c to a plaintext backend only: such a backend has
#   # no ALPN to negotiate over and so no other way to advertise h2. A
#   # backend reached through [listeners.backend_tls] negotiates HTTP/2 via
#   # ALPN on its own and needs nothing here — setting this alongside
#   # backend_tls is rejected at config-parse time. Unlike every other field
#   # in this section, backend_h2c works independently of [listeners.tls]
#   # and of enabled above: it is read straight off this config and applied
#   # to the outbound backend client regardless of what the frontend
#   # negotiates, so a plaintext-front, plaintext-h2c-backend listener
#   # genuinely gets prior-knowledge h2c to its backends.
#   backend_h2c = false

# ── Backend re-encryption (optional) ────────────────────────────────────
# Uncomment to speak TLS onward to the backends too, not just to the client.
# Verification is ON by default: encryption without authentication does not
# address the threat that motivates it — if the network isn't trusted to
# carry plaintext, it isn't trusted not to sit in the middle of a TLS
# session either.
# [listeners.backend_tls]
#   # Omit for the system trust store. Set this for an internal PKI, which
#   # is the common case on this path.
#   ca_file = "/etc/lb/tls/internal-ca.crt"
#   # true turns verification off entirely — a deliberately ugly escape
#   # hatch for a fleet that meets self-signed backend certs on day one. It
#   # logs a warning at every startup and sets the
#   # lb_backend_tls_verification_disabled gauge, specifically so it cannot
#   # hide in a config file for two years.
#   danger_accept_invalid_certs = false

  [[listeners.backends]]
  id = "web1"
  address = "127.0.0.1:9001"
  # Consulted only by load_balancing.strategy = "weighted_round_robin" (as a
  # multiplier on how often this backend is picked) and "consistent_hash"
  # (as a multiplier on its share of the hash ring). Ignored by
  # "round_robin" and "least_connections". A weight of 0 drains a backend
  # without removing it from the list.
  weight  = 1
  # Required whenever [listeners.backend_tls] is set: the hostname on this
  # backend's certificate, used only for SNI and hostname verification. The
  # TCP dial is still pinned to `address` above — server_name is never
  # DNS-resolved to pick the connection target, which is what keeps this
  # setting from silently overriding the address you configured.
  # server_name = "web1.internal"

  [[listeners.backends]]
  id = "web2"
  address = "127.0.0.1:9002"
  weight  = 1
  # server_name = "web2.internal"

  [listeners.health_check]
  path = "/health"
  interval_ms = 2000
  timeout_ms = 500
  failure_threshold = 3
  cooldown_ms = 5000

  [listeners.rate_limit]
  key = "source_ip"          # or "header:X-API-Key"
  rate_per_sec = 50
  burst = 100
  # Caps distinct tracked keys. Past this, newcomers share one overflow
  # budget so a spray attack cannot grow memory without bound — established
  # clients keep their own limits.
  max_tracked_keys = 100000

  [listeners.load_balancing]
  # One of:
  #   "round_robin"          -- cycles through eligible backends in order.
  #   "least_connections"    -- picks whichever eligible backend currently
  #                             has the fewest in-flight requests.
  #   "weighted_round_robin" -- round-robin, but each backend's `weight`
  #                             (above) controls how often it's picked.
  #   "consistent_hash"      -- hashes this listener's rate-limit key onto a
  #                             ring of backends, so the same client keeps
  #                             landing on the same backend as long as the
  #                             backend set doesn't change.
  strategy = "round_robin"

# ── TCP (L4) listener ─────────────────────────────────────────────────
[[listeners]]
name     = "postgres"
protocol = "tcp"
listen   = "0.0.0.0:5432"
# Bounds the TCP connect AND, when backend_tls below is set, the TLS
# handshake to the backend too — the two run sequentially, so on a
# backend_tls listener this ceiling is really 2x per attempt, not 1x. The
# connect-retry loop tries up to two backends before giving up, so the
# worst case before ConnectFailed is 4x this value, not 1x. 2000 here means
# an 8s worst case under backend_tls, not a 2s one — size it with that in
# mind rather than as a single-hop budget.
connect_timeout_ms = 2000
idle_timeout_ms    = 300000  # applies to both directions of the byte pump --
                              # a client that stops reading its half is timed
                              # out the same as one that stops sending
max_connections        = 10000
max_connections_per_ip = 100

# proxy_protocol = true
# See the HTTP listener's comment above -- same option, same trust model,
# applies identically to a TCP listener.

# ── TLS termination (optional) ──────────────────────────────────────────
# Same [listeners.tls] shape as the HTTP listener above — see its comments
# for what each field does. Shown here because this is the configuration
# operators most need the cost note below for, and the HTTP example alone
# leaves it unclear that TCP listeners take the same block.
# [listeners.tls]
#   handshake_timeout_ms = 5000
#   min_version = "1.2"
#   reload_interval_secs = 60
#   # hsts_max_age_secs is HTTP-only and rejected outright here — a TCP
#   # listener has no response to put a header on.
#
#     [[listeners.tls.certificates]]
#     name      = "postgres-primary"
#     cert_file = "/etc/lb/tls/postgres.crt"
#     key_file  = "/etc/lb/tls/postgres.key"
#     hostnames = ["postgres.internal"]

# ── Backend re-encryption (optional) ────────────────────────────────────
# Same [listeners.backend_tls] shape as the HTTP listener above.
#
# Read this before turning both blocks on together: a TCP session is 1:1
# with a client connection and L4 does not pool (unlike L7, which amortises
# handshake cost across a kept-alive backend connection) — so a listener
# that both terminates (block above) and re-encrypts (this block) pays TWO
# full TLS handshakes per proxied connection, one on each side, for every
# single connection, with no reuse on either leg. That is the most
# expensive configuration this system supports; see the README's TLS
# section ("performance notes") before sizing capacity around it.
# [listeners.backend_tls]
#   ca_file = "/etc/lb/tls/internal-ca.crt"
#   danger_accept_invalid_certs = false

  [[listeners.backends]]
  id = "pg1"
  address = "10.0.0.5:5432"
  # Required whenever [listeners.backend_tls] above is set — see the HTTP
  # listener's backend for what this does and why it's separate from
  # `address`.
  # server_name = "postgres.internal"

  [listeners.health_check]
  # no `path` — a TCP backend is probed by connecting, not by GET
  interval_ms = 2000
  timeout_ms = 500
  failure_threshold = 3
  cooldown_ms = 5000

  [listeners.rate_limit]
  key = "source_ip"          # the only valid key at L4 — there are no headers
  rate_per_sec = 10
  burst = 20

  [listeners.load_balancing]
  # See the HTTP listener's load_balancing block above for the full list of
  # strategies and what each one does.
  strategy = "round_robin"
