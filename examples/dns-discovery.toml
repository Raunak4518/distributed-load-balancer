[[listeners]]
name     = "web"
protocol = "http"
listen   = "0.0.0.0:8080"

[listeners.dns_discovery]
name               = "backends.internal"
port               = 9000
poll_interval_secs = 10

[listeners.health_check]
path              = "/health"
interval_ms       = 2000
timeout_ms        = 500
failure_threshold = 3
cooldown_ms       = 5000

[listeners.rate_limit]
key          = "source_ip"
rate_per_sec = 50
burst        = 100

[listeners.load_balancing]
strategy = "round_robin"
