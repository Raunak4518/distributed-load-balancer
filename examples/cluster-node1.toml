[cluster]
node_id           = "lb-1"
listen            = "127.0.0.1:7946"
peers             = ["127.0.0.1:7947"]
shared_secret_env = "LB_CLUSTER_SECRET"

[[listeners]]
name     = "web"
protocol = "http"
listen   = "0.0.0.0:8080"

[[listeners.backends]]
id      = "node1-backend"
address = "127.0.0.1:9001"

[listeners.health_check]
path              = "/health"
interval_ms       = 2000
timeout_ms        = 500
failure_threshold = 3
cooldown_ms       = 5000

[listeners.rate_limit]
key          = "source_ip"
rate_per_sec = 50
burst        = 100

[listeners.load_balancing]
strategy = "round_robin"
