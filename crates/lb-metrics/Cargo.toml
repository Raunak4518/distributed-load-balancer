[package]
name = "lb-metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Prometheus metrics registry and admin HTTP server"

[dependencies]
prometheus = { version = "0.14", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "macros"] }
tracing = "0.1"
# Constant-time comparison for the admin bearer token (`admin::route`) --
# a byte-wise `==` would leak match progress through timing, the same
# concern `lb-cluster`'s gossip HMAC check already guards against.
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = "0.12"
