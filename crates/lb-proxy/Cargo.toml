[package]
name = "lb-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lb-core = { path = "../lb-core" }
lb-healthcheck = { path = "../lb-healthcheck" }
lb-metrics = { path = "../lb-metrics" }
lb-ratelimit = { path = "../lb-ratelimit" }
lb-tls = { path = "../lb-tls" }
# For `pump` (upgrade.rs's post-upgrade byte relay): already generic over
# any `AsyncRead`/`AsyncWrite`, not TCP-specific despite the crate name, and
# already has exactly the idle-timeout/half-close semantics a WebSocket
# connection needs. No `lb-tcp` -> `lb-proxy` edge exists, so this adds no
# cycle.
lb-tcp = { path = "../lb-tcp" }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
# hyper-rustls defaults to aws-lc-rs, which needs cmake and a C toolchain
# unavailable here. Same `ring` selection as every other TLS crate in the
# graph: they must all agree on one provider or `install_default()`
# conflicts at runtime.
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12"] }
# For an explicit, infallible empty-trust-store `ClientConfig` on the
# plaintext (`backend_tls: None`) path in `build_client` -- an empty
# `RootCertStore` never touches the filesystem or the OS certificate store,
# unlike `with_native_roots()`, which this replaces. Same `ring`,
# default-features = false selection as every other TLS dependency here.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
# "net" for the WebSocket/Upgrade backend leg's dedicated, non-pooled
# connection (`upgrade.rs` dials its own `TcpStream`); "io-util" for
# `tokio::io::split`, splitting each side of that upgrade for `lb_tcp::pump`.
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
# For the WebSocket/Upgrade backend leg's TLS: `BackendConnector::tls_connector_http1_only`
# (lb-tls) returns a `tokio_rustls::TlsConnector`, called directly here rather
# than through `hyper-rustls` (that machinery is HTTP-request-shaped and
# pooled -- wrong fit for a one-off, must-stay-http/1.1 connection). Same
# `ring`/`tls12` feature selection as every other TLS dependency in this
# graph.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# For `ResponseCache` (cache.rs): a concurrent map, already a workspace
# dependency (lb-cluster, lb-ratelimit) for the same "many readers/writers,
# no coarse lock" shape.
dashmap = "6"
# For the WebSocket/Upgrade backend leg's TCP keepalive tuning
# (`apply_tcp_keepalive` in upgrade.rs) -- see `lb-server`'s Cargo.toml
# comment for why this is a direct dependency despite already being
# transitively present, and why "all" is needed. The *ordinary* HTTP
# backend leg needs none of this: `HttpConnector`'s own native setters
# (`forward.rs::build_client`) cover it without touching socket2 directly.
socket2 = { version = "0.6", features = ["all"] }
# For `PinnedResolver` (resolver.rs): a custom `HttpConnector` resolver is a
# `tower_service::Service<Name>` impl -- see hyper-util's `connect::dns`
# module docs. Already resolved transitively via hyper-util itself, so this
# adds no new crate to Cargo.lock, just an edge to it.
tower-service = "0.3"

[dev-dependencies]
lb-core = { path = "../lb-core", features = ["test-util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
