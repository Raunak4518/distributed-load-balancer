[package]
name = "lb-proxy"
version = "0.1.0"
edition.workspace = true

[dependencies]
lb-core = { path = "../lb-core" }
lb-healthcheck = { path = "../lb-healthcheck" }
lb-metrics = { path = "../lb-metrics" }
lb-tls = { path = "../lb-tls" }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# hyper-rustls defaults to aws-lc-rs, which needs cmake and a C toolchain
# unavailable here. Same `ring` selection as every other TLS crate in the
# graph: they must all agree on one provider or `install_default()`
# conflicts at runtime.
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "native-tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
lb-core = { path = "../lb-core", features = ["test-util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
