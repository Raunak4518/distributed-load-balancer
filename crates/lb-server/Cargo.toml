[package]
name = "lb-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
lb-core = { path = "../lb-core" }
lb-ratelimit = { path = "../lb-ratelimit" }
lb-balancer = { path = "../lb-balancer" }
lb-healthcheck = { path = "../lb-healthcheck" }
lb-proxy = { path = "../lb-proxy" }
lb-tcp = { path = "../lb-tcp" }
lb-metrics = { path = "../lb-metrics" }
lb-cluster = { path = "../lb-cluster" }
lb-tls = { path = "../lb-tls" }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    "io-util",
    "sync",
] }
reqwest = "0.12"

[dev-dependencies]
reqwest = "0.12"
bytes = "1"
http-body-util = "0.1"
# Test certificates are generated at run time; none are committed. Left on
# native-tls (reqwest's default) deliberately: switching the test client to
# rustls-tls risks pulling aws-lc-rs into the dev graph, and schannel is
# entirely independent of the server's rustls+ring stack.
rcgen = "0.13"
