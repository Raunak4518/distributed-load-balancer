[package]
name = "lb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A multi-protocol load balancer: TLS termination, HTTP/1.1 and HTTP/2, rate limiting, health checks, and distributed rate-limit coordination"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["load-balancer", "reverse-proxy", "rate-limiting", "http2", "tls"]
categories = ["network-programming", "web-programming::http-server", "command-line-utilities"]

[package.metadata.deb]
maintainer = "Raunak4518 <u24ai109@aid.svnit.ac.in>"
copyright = "2026, the distributed-load-balancer contributors"
license-file = ["../../LICENSE-MIT", "4"]
extended-description = """\
A multi-protocol load balancer in Rust. Terminates TLS, speaks HTTP/1.1 and \
HTTP/2, rate-limits by IP or header, health-checks backends, and forwards \
traffic over HTTP or raw TCP. Multiple instances share rate-limit counters \
through a gossip-based CRDT protocol -- no central data store required."""
depends = "$auto"
section = "net"
priority = "optional"
# Invoked as `cd crates/lb-server && cargo deb --no-build` in CI, so these
# resolve relative to this crate's own directory -- `target/` is shared at
# the workspace root, two levels up from here.
assets = [
    ["../../target/release/lb-server", "usr/bin/", "755"],
    ["../../packaging/systemd/lb-server.service", "lib/systemd/system/", "644"],
    ["../../config.example.toml", "etc/lb-server/config.toml", "644"],
]
conf-files = ["/etc/lb-server/config.toml"]

# Invoked as `cargo generate-rpm -p crates/lb-server` from the workspace
# root in CI (its documented way to target one workspace member), so these
# resolve relative to the workspace root, unlike the `deb` assets above.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/lb-server", dest = "/usr/bin/lb-server", mode = "755" },
    { source = "packaging/systemd/lb-server.service", dest = "/usr/lib/systemd/system/lb-server.service", mode = "644" },
    { source = "config.example.toml", dest = "/etc/lb-server/config.toml", mode = "644", config = true },
]

[dependencies]
lb-core = { path = "../lb-core" }
lb-ratelimit = { path = "../lb-ratelimit" }
lb-balancer = { path = "../lb-balancer" }
lb-healthcheck = { path = "../lb-healthcheck" }
lb-proxy = { path = "../lb-proxy" }
lb-tcp = { path = "../lb-tcp" }
lb-metrics = { path = "../lb-metrics" }
lb-tracing = { path = "../lb-tracing" }
lb-cluster = { path = "../lb-cluster" }
lb-tls = { path = "../lb-tls" }
dashmap = "6"
tracing = "0.1"
arc-swap = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
# "tokio" for `hyper_util::rt::*`; "service" for
# `hyper_util::service::TowerToHyperService`, the bridge `drive()` uses to
# hand a tower-middleware stack (response compression) to hyper's server.
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# For the admin backend-management extension (`admin_backends.rs`): its
# response type matches `lb_metrics::admin`'s own `Response<Full<Bytes>>`,
# and its `GET /backends` listing is JSON. Already in the lock via other
# workspace members (lb-cluster for serde_json, lb-metrics's own admin
# module for the other two) -- this just makes lb-server's own use of them
# a direct dependency instead of an implicit transitive one.
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = "1"
# Response compression (`compression.rs`): `tower`'s `service_fn`/
# `ServiceBuilder` wrap `lb_proxy::handle` so `tower-http`'s `CompressionLayer`
# can sit in front of it; `TowerToHyperService` above bridges the resulting
# tower `Service` back to what `serve_connection` expects. `default-features
# = false` on tower-http: its default feature set is empty anyway, this is
# just explicit about only pulling the compression algorithms, not e.g. its
# unrelated `fs`/`trace`/`auth` middleware.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = [
    "compression-full",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    "io-util",
    "sync",
] }
# For client-facing TCP keepalive tuning (`apply_tcp_keepalive` in lib.rs):
# already transitively present (pulled in by tokio and hyper-util), added
# directly here since this crate calls its API itself rather than only
# through those. "all" is required for `TcpKeepalive::with_retries`
# (`TCP_KEEPCNT`) to compile on both Linux and Windows.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `native-tls-alpn` is what makes the test client offer `h2` at all: reqwest's
# ALPN request is `#[cfg(feature = "native-tls-alpn")]`, and that feature is
# not in its defaults, so a plain `reqwest = "0.12"` client negotiates nothing
# and every HTTP/2 assertion in `http2_integration.rs` would silently be
# testing HTTP/1.1. It pulls only `native-tls-crate/alpn` and `hyper-tls/alpn`
# into the schannel stack already present -- no second TLS implementation, and
# so no route for aws-lc-rs into the dev graph. `http2` is already a reqwest
# default; only the negotiation was missing.
reqwest = { version = "0.12", features = ["native-tls-alpn"] }
# `test-util` for `#[tokio::test(start_paused = true)]`, which lets
# `first_byte.rs` test a 300ms deadline and a 30s idle period without waiting
# for either. Dev-only: resolver 2 keeps it out of the `cargo build` graph, so
# the shipped binary has no test clock in it.
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "process"] }
bytes = "1"
http-body-util = "0.1"
# Test certificates are generated at run time; none are committed. Left on
# native-tls (reqwest's default) deliberately: switching the test client to
# rustls-tls risks pulling aws-lc-rs into the dev graph, and schannel is
# entirely independent of the server's rustls+ring stack.
rcgen = "0.13"
# A TLS client for the raw-TCP listener test, where there is no HTTP and so
# no reqwest. Same provider selection as lb-tls — ring, nothing by default —
# so the test client cannot drag aws-lc-rs into the dev graph. `rustls` is
# named directly because the test implements a ServerCertVerifier; both are
# already in the lock via lb-tls, so neither adds a crate.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
x509-parser = "0.16"
# Raw HTTP/2, for the two attacks in `http2_integration.rs` that no HTTP
# client will perform: cancelling a request the instant it is made (Rapid
# Reset, CVE-2023-44487), and opening more concurrent streams than the server
# advertised. reqwest cannot express either -- it is a conforming client, and
# both are definitionally non-conforming. Already in the lock as hyper's own
# h2 implementation, so this adds no crate; no TLS features exist on it, so it
# is no route for aws-lc-rs either.
h2 = "0.4"
# `server-auto` (-> server, http1, http2) for `hyper_util::server::conn::auto::Builder`,
# used only by the backend test fixtures in `http2_integration.rs` that must
# accept either protocol on one port -- production dispatch (`lb_server::drive`)
# deliberately picks by ALPN instead of sniffing. Dev-only: resolver 2 keeps
# these off the shipped binary's hyper-util build, which only ever needs
# `tokio`.
hyper-util = { version = "0.1", features = ["server-auto"] }
