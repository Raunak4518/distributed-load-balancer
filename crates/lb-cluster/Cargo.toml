[package]
name = "lb-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Gossip-based cluster coordination: an HMAC-authenticated G-Counter CRDT for distributed rate limiting"

[dependencies]
lb-core = { path = "../lb-core" }
lb-tls = { path = "../lb-tls" }
lb-metrics = { path = "../lb-metrics" }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }

[dev-dependencies]
lb-core = { path = "../lb-core", features = ["test-util"] }
rcgen = "0.13"
proptest = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
] }
