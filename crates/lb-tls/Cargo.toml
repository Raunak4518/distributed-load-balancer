[package]
name = "lb-tls"
version = "0.1.0"
edition.workspace = true

[dependencies]
lb-core = { path = "../lb-core" }
lb-metrics = { path = "../lb-metrics" }
# ring, not the aws-lc-rs default: aws-lc-rs needs cmake and a C toolchain,
# which is a real build risk on this machine. Every TLS crate below must
# agree on the provider or install_default() conflicts at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
# System trust store for the backend-connector path when no ca_file is
# configured. Errors from individual native certs are safe to ignore --
# `CertificateResult.certs` is used, malformed OS entries just don't count.
rustls-native-certs = "0.8"
# hyper-rustls defaults to aws-lc-rs, which needs cmake and a C toolchain
# unavailable here -- same reason rustls itself is pinned to ring above.
# Every TLS crate in the graph must agree on one provider.
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "native-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
x509-parser = "0.16"
thiserror = "1"
tracing = "0.1"
# `time` for the handshake timeout in `accept()` and the reload poll
# interval; `rt` for the reloader's own `tokio::spawn`. `AsyncRead`/
# `AsyncWrite` (used only as trait bounds) need no feature at all -- do not
# add io-util here, it belongs to the extension traits the tests use, not
# this crate.
tokio = { version = "1", default-features = false, features = ["time", "rt"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "io-util"] }
