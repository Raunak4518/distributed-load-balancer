[package]
name = "lb-tls"
version.workspace = true
edition.workspace = true

[dependencies]
lb-core = { path = "../lb-core" }
lb-metrics = { path = "../lb-metrics" }
# ring, not the aws-lc-rs default: aws-lc-rs needs cmake and a C toolchain,
# which is a real build risk on this machine. Every TLS crate below must
# agree on the provider or install_default() conflicts at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
# System trust store for the backend-connector path when no ca_file is
# configured. A single malformed OS entry doesn't fail construction, but an
# empty result does -- see connector.rs's apply_native_certs, which is where
# `CertificateResult.errors` actually gets used, not discarded.
# default-features = false to match every other TLS dependency here: this
# crate has no [features] table today, but a future version bump is not
# getting to silently opt lb-tls into a second crypto provider.
rustls-native-certs = { version = "0.8", default-features = false }
# hyper-rustls defaults to aws-lc-rs, which needs cmake and a C toolchain
# unavailable here -- same reason rustls itself is pinned to ring above.
# Every TLS crate in the graph must agree on one provider.
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
x509-parser = "0.16"
thiserror = "1"
tracing = "0.1"
# `time` for the handshake timeout in `accept()` and the reload poll
# interval; `rt` for the reloader's own `tokio::spawn`. `AsyncRead`/
# `AsyncWrite` (used only as trait bounds) need no feature at all -- do not
# add io-util here, it belongs to the extension traits the tests use, not
# this crate.
tokio = { version = "1", default-features = false, features = ["time", "rt"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "io-util"] }
