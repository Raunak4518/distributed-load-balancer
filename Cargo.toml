[workspace]
resolver = "2"
members = [
    "crates/lb-core",
    "crates/lb-ratelimit",
    "crates/lb-balancer",
    "crates/lb-healthcheck",
    "crates/lb-proxy",
    "crates/lb-tcp",
    "crates/lb-cluster",
    "crates/lb-metrics",
    "crates/lb-tracing",
    "crates/lb-tls",
    "crates/lb-bench",
    "crates/lb-server",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Raunak4518/distributed-load-balancer"
homepage = "https://github.com/Raunak4518/distributed-load-balancer"
